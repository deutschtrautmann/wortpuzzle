<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wörter Puzzle - Edition</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        padding: 0;
        margin: 0;
        background: #f9fbfd;
        color: #333;
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
    }

    h2 { margin-top: 0; font-size: 22px; color: #2c3e50;}

    .container {
        min-height: 70px;
        border: 3px dashed #ccc;
        border-radius: 16px;
        padding: 14px;
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        background: #fff;
        align-content: flex-start;
    }
    .pool { background: #dfefff; border-color: #90c0f0; }

    .container.drag-over {
        border-color: #4CAF50;
        background: rgba(76, 175, 80, 0.07);
    }

    .word {
        background: white;
        padding: 13px 20px;
        border-radius: 12px;
        box-shadow: 0 3px 7px rgba(0,0,0,0.12);
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        border: 1px solid #ddd;
        font-size: 13px;
        display: inline-block;
        touch-action: none;
        transition: box-shadow 0.15s, transform 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        will-change: transform;
    }
    .word:active { cursor: grabbing; }

    .group {
        display: flex;
        gap: 6px;
        border: 3px solid #4CAF50;
        border-radius: 18px;
        padding: 7px 10px;
        background: rgba(76, 175, 80, 0.07);
        align-items: center;
        flex-wrap: wrap;
        cursor: grab;
        touch-action: none;
        position: relative;
        transition: transform 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        will-change: transform;
    }

    .touch-ghost {
        position: fixed;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.85;
        transform: scale(1.08);
        box-shadow: 0 8px 24px rgba(0,0,0,0.22);
        border-radius: 12px;
        transition: none;
    }
    .dragging-source { opacity: 1; color: #000; }

    #app-box {
        background: #fff;
        border: none;
        border-radius: 0;
        padding: 20px;
        min-height: 100vh;
        box-shadow: none;
    }

    button {
        margin-top: 15px;
        width: 100%;
        max-width: 340px;
        padding: 18px;
        font-size: 20px;
        border: none;
        border-radius: 15px;
        background: #4CAF50;
        color: white;
        cursor: pointer;
        display: block;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }
    button:active { filter: brightness(0.9); }
    .restart-btn { background: #3498db; }

    #fileLabel {
        display: inline-block;
        background: #e8f0fe;
        border: 2px solid #4a90d9;
        border-radius: 14px;
        padding: 0 10px;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 12px;
        touch-action: manipulation;
    }
    #fileInput { display: none; }

    .progress {
        font-size: 13px;
        color: #888;
        margin-bottom: 4px;
    }

    .top-controls {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }

    .top-button,
    #fileLabel {
        width: 122px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #e8f0fe;
        border: 2px solid #4a90d9;
        border-radius: 14px;
        padding: 0 10px;
        font-size: 13px;
        cursor: pointer;
        color: #333;
        box-sizing: border-box;
        margin: 0;
        line-height: 1;
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        text-align: center;
    }

    .top-button:hover,
    #fileLabel:hover { background: #dce8fd; }

    #textModal {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 20px;
    }

    #textModalContent {
        background: white;
        width: min(720px, 100%);
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    #textInputArea {
        width: 100%;
        min-height: 240px;
        border: 2px solid #b7c7dd;
        border-radius: 12px;
        padding: 14px;
        font-size: 17px;
        resize: vertical;
        font-family: inherit;
    }

    .modal-buttons {
        display: flex;
        gap: 12px;
        margin-top: 16px;
        flex-wrap: wrap;
    }

    .modal-buttons button { max-width: 220px; margin-top: 0; }
    .secondary-btn { background: #7f8c8d; }

    /* ── Maskottchen Bereich (Schaf) ────────────────────────── */
    #mascot-container {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 15px;
        margin-bottom: 5px;
        padding: 15px;
        background: #f4f9f4;
        border-radius: 18px;
        border: 2px solid #c2e0c2;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    #mascot-image {
        width: 90px;
        height: 100px;
        flex-shrink: 0;
        transform-origin: bottom center;
        animation: floatMascot 4s ease-in-out infinite;
    }

    .sheep-svg {
        width: 100%;
        height: 100%;
    }

    .eye-happy, .mouth-happy { display: block; }
    .eye-sad, .mouth-sad { display: none; }

    .is-sad .eye-happy { display: none; }
    .is-sad .eye-sad { display: block; }
    .is-sad .mouth-happy { display: none; }
    .is-sad .mouth-sad { display: block; }

    #mascot-heart {
        display: none;
        transform-origin: 50px 72px;
        animation: heartPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .has-heart #mascot-heart {
        display: block;
    }
    .has-heart #left-arm {
        transform: rotate(25deg) translate(2px, -4px) !important;
        animation: none !important;
    }
    .has-heart #right-arm {
        transform: rotate(-25deg) translate(-2px, -4px) !important;
        animation: none !important;
    }

    @keyframes heartPop {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .animate-jump {
        animation: jumpMascot 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards !important;
    }

    .animate-shake {
        animation: shakeMascot 0.5s ease-in-out forwards !important;
    }

    #mascot-speech-bubble {
        background: #fff;
        padding: 12px 18px;
        border-radius: 14px;
        position: relative;
        border: 1px solid #d4ebd4;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        flex-grow: 1;
    }

    #mascot-speech-bubble::after {
        content: '';
        position: absolute;
        left: -10px;
        top: 30px;
        border-width: 6px 10px 6px 0;
        border-style: solid;
        border-color: transparent white transparent transparent;
    }

    #mascot-text {
        margin: 0;
        font-size: 15px;
        line-height: 1.4;
        font-weight: 500;
        color: #2c3e50;
    }

    .blink-pupil {
        animation: blinkAnimation 5s infinite;
        transform-origin: center;
    }
    @keyframes blinkAnimation {
        0%, 95%, 100% { transform: scaleY(1); opacity: 1; }
        97% { transform: scaleY(0.1); opacity: 0.1; }
    }

    #left-leg {
        animation: stepLeft 3s infinite ease-in-out;
        transform-origin: top center;
    }
    #right-leg {
        animation: stepRight 3s infinite ease-in-out;
        transform-origin: top center;
    }
    @keyframes stepLeft {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
    }
    @keyframes stepRight {
        0%, 100% { transform: translateY(-2px); }
        50% { transform: translateY(0); }
    }

    #left-arm {
        animation: waveLeft 4s infinite ease-in-out;
        transform-origin: 32px 58px;
    }
    #right-arm {
        animation: waveRight 4s infinite ease-in-out;
        transform-origin: 68px 58px;
    }
    @keyframes waveLeft {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-5deg); }
    }
    @keyframes waveRight {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(5deg); }
    }

    @keyframes floatMascot {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
    }

    @keyframes jumpMascot {
        0% { transform: translateY(0) scale(1); }
        20% { transform: translateY(2px) scaleY(0.9); }
        50% { transform: translateY(-20px) scaleY(1.1); }
        80% { transform: translateY(0) scaleY(0.95); }
        100% { transform: translateY(0) scale(1); }
    }

    @keyframes shakeMascot {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
    }
</style>
</head>
<body>
<div id="app-box">

<h2>Wörter-Puzzle</h2>

<div class="top-controls">
    <label id="fileLabel" class="top-button" for="fileInput">Textdatei</label>
    <div id="textInputBtn" class="top-button">Texteingabe</div>
    <div id="musicToggleBtn" class="top-button">Musik an</div>
</div>

<input type="file" id="fileInput" accept=".txt">

<div id="textModal">
    <div id="textModalContent">
        <h3>Text oder Sätze eingeben</h3>
        <p>Bitte pro Zeile einen vollständigen Satz eingeben.</p>
        <textarea id="textInputArea" placeholder="Heute scheint die Sonne.
Ich lerne Deutsch.
Das Spiel macht Spaß."></textarea>

        <div class="modal-buttons">
            <button id="applyTextBtn">Text übernehmen</button>
            <button id="closeTextBtn" class="secondary-btn">Schließen</button>
        </div>
    </div>
</div>

<div id="mascot-container">
    <div id="mascot-image">
        <svg class="sheep-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
            <g id="left-leg">
                <rect x="33" y="85" width="10" height="15" rx="3" fill="#d0d0d0"/>
                <path d="M 33 95 L 43 95 L 43 100 L 33 100 Z" fill="#4a4a4a"/>
            </g>
            <g id="right-leg">
                <rect x="57" y="85" width="10" height="15" rx="3" fill="#d0d0d0"/>
                <path d="M 57 95 L 67 95 L 67 100 L 57 100 Z" fill="#4a4a4a"/>
            </g>
            
            <path d="M 30 30 Q 10 20 15 40 Q 20 45 32 38" fill="none" stroke="#e8c7e8" stroke-width="7" stroke-linecap="round"/>
            <path d="M 70 30 Q 90 20 85 40 Q 80 45 68 38" fill="none" stroke="#e8c7e8" stroke-width="7" stroke-linecap="round"/>

            <ellipse cx="23" cy="35" rx="5" ry="9" fill="#fce4ec" transform="rotate(-30 23 35)"/>
            <ellipse cx="77" cy="35" rx="5" ry="9" fill="#fce4ec" transform="rotate(30 77 35)"/>

            <circle cx="50" cy="58" r="32" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
            <circle cx="30" cy="45" r="12" fill="#ffffff"/>
            <circle cx="70" cy="45" r="12" fill="#ffffff"/>
            <circle cx="50" cy="38" r="14" fill="#ffffff"/>
            <circle cx="25" cy="65" r="12" fill="#ffffff"/>
            <circle cx="75" cy="65" r="12" fill="#ffffff"/>
            <circle cx="40" cy="80" r="12" fill="#ffffff"/>
            <circle cx="60" cy="80" r="12" fill="#ffffff"/>

            <ellipse cx="50" cy="48" rx="18" ry="16" fill="#ffffff"/>
            
            <g id="mascot-heart">
                <path d="M 50 78 C 44 70, 36 70, 36 77 C 36 84, 44 88, 50 94 C 56 88, 64 84, 64 77 C 64 70, 56 70, 50 78 Z" fill="#ff4d4d"/>
            </g>

            <g id="left-arm">
                <path d="M 32 58 Q 42 68 46 64" fill="none" stroke="#d0d0d0" stroke-width="6" stroke-linecap="round"/>
                <path d="M 43 61 L 46 64 L 42 67 Z" fill="#4a4a4a"/>
            </g>
            <g id="right-arm">
                <path d="M 68 58 Q 58 68 54 64" fill="none" stroke="#d0d0d0" stroke-width="6" stroke-linecap="round"/>
                <path d="M 57 61 L 54 64 L 58 67 Z" fill="#4a4a4a"/>
            </g>

            <g class="eye-happy">
                <circle class="blink-pupil" cx="43" cy="46" r="2.5" fill="#333"/>
                <circle class="blink-pupil" cx="57" cy="46" r="2.5" fill="#333"/>
                <path d="M 39 41 Q 43 40 45 42" fill="none" stroke="#333" stroke-width="1"/>
                <path d="M 61 41 Q 57 40 55 42" fill="none" stroke="#333" stroke-width="1"/>
            </g>
            <path class="mouth-happy" d="M 46 54 Q 50 58 54 54" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

            <g class="eye-sad">
                <path d="M 40 48 Q 43 44 46 47" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                <path d="M 60 48 Q 57 44 54 47" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
            </g>
            <path class="mouth-sad" d="M 47 57 Q 50 54 53 57" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

            <path d="M 48 51 L 52 51 L 50 53 Z" fill="#555"/>
        </svg>
    </div>
    <div id="mascot-speech-bubble">
        <p id="mascot-text">Hallo! Ich bin dein Lern-Freund. Bringst du die Wörter in die richtige Reihenfolge?</p>
    </div>
</div>

<div id="game"></div>
<button id="checkBtn" onclick="checkSentence()">Prüfen</button>

</div>

<script>
// ── Daten & Zustand ───────────────────────────────────────────────
let sentences = ["eins zwei drei vier fünf sechs sieben acht neun zehn"];
let current = 0;
let lastFileData = "";
let errorDamping = 0;

// Generative Audio-Variablen (Portal-Style Varianz)
let proceduralSeed = 1; 
let currentPattern = [1, 1.2, 1.5, 1.8]; 

const greetings = ["Neue Sätze! Viel Spaß beim Lernen!", "Super, neue Texte! Starten wir!", "Bist du bereit? Los geht's!"];
const correctComments = ["Sehr gut! Der Satz ist richtig!", "Perfekt! Du machst das toll!", "Das stimmt! Genau richtig!", "Klasse! Richtige Antwort!"];
const partialComments = ["Gut! Ein paar Wörter passen schon!", "Nicht schlecht! Ein Teil ist richtig!", "Es wird! Einige Wörter sind am richtigen Platz!"];
const wrongComments = ["Das stimmt leider noch nicht. Probier es noch mal!", "Leider falsch. Du schaffst das!", "Noch nicht richtig. Kein Problem!"];

function getRandomElement(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function triggerMascotAnimation(type) {
    const img = document.getElementById('mascot-image');
    img.classList.remove('animate-jump', 'animate-shake');
    void img.offsetWidth;
    if (type === 'jump') { img.classList.add('animate-jump'); } 
    else if (type === 'shake') { img.classList.add('animate-shake'); }
}

// Erzeugt ein neues musikalisches Muster basierend auf Interaktionen
function shiftProceduralMusic() {
    proceduralSeed = Math.random();
    // Dynamischer Wechsel zwischen harmonischen Aperture Science Pentatoniken
    const scalePools = [
        [1, 1.2, 1.33, 1.5, 1.6, 1.8, 2],
        [1, 1.25, 1.44, 1.5, 1.75, 1.875, 2],
        [1, 1.125, 1.35, 1.5, 1.6, 1.9, 2]
    ];
    currentPattern = scalePools[Math.floor(proceduralSeed * scalePools.length)];
}

// ── Neue Prozedurale Portal 2 Audio-Engine ────────────────────────
let audioCtx = null;
let ambientStarted = false;
let ambientInterval = null;
let musicEnabled = true;
let beatIndex = 0;

function initAudio() {
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    if (!ambientStarted) { ambientStarted = true; startAmbientMusic(); }
}

function tone(freq, type='sine', start=0, dur=0.18, vol=0.15, endFreq=null, filterFreq=2200) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    filter.type = 'lowpass';
    filter.frequency.value = filterFreq;
    osc.type = type;

    const now = audioCtx.currentTime + start;
    osc.frequency.setValueAtTime(freq, now);
    if (endFreq) { osc.frequency.exponentialRampToValueAtTime(endFreq, now + dur); }

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + dur);
}

function getPuzzleProgress() {
    const pool = document.querySelector('.pool');
    if (!pool) return 0;
    const totalWords = pool.querySelectorAll('.word').length;
    if (totalWords <= 1) return 1;
    const groupedWords = pool.querySelectorAll('.group .word').length;
    return groupedWords / totalWords;
}

function startAmbientMusic() {
    if (!musicEnabled) return;

    function playBeatStep() {
        if (!musicEnabled) { ambientInterval = null; return; }
        
        const progress = getPuzzleProgress(); 
        const baseNote = 110; 
        
        if (errorDamping > 0) errorDamping -= 0.1;

        // LAYER 1: Generative Drone (Variiert je nach Seed)
        if (beatIndex % 4 === 0) {
            const droneVol = (0.28 - errorDamping * 0.15);
            const dynamicDroneModifier = 1 + (proceduralSeed * 0.02);
            tone(baseNote * dynamicDroneModifier, 'sine', 0, 1.4, Math.max(0.05, droneVol), baseNote * 1.002, 800);
            tone(baseNote * 1.5, 'sine', 0.2, 1.2, Math.max(0.02, droneVol * 0.4), baseNote * 1.502, 900);
        }

        // LAYER 2: Das Interaktive Eingabe-Mosaik (Verändert sich bei JEDER Bewegung)
        if (progress > 0.1) {
            const noteStep = (beatIndex + Math.floor(proceduralSeed * 10)) % currentPattern.length;
            const arpFreq = baseNote * 2 * currentPattern[noteStep];
            const arpVol = (0.09 + progress * 0.09) * (1 - errorDamping * 0.5);
            
            // Jede Interaktion verschiebt die Klangwellen-Struktur minimal (sine/triangle-Wechsel)
            const waveform = proceduralSeed > 0.5 ? 'triangle' : 'sine';
            tone(arpFreq, waveform, 0, 0.22, arpVol, arpFreq * 1.005, 2000);
            
            if (progress > 0.4 && beatIndex % 2 === 0) {
                tone(arpFreq * 1.33, 'sine', 0.06, 0.12, 0.04, null, 2500);
            }
        }

        // LAYER 3: Mechanischer Takt
        if (progress > 0.6) {
            const clickVol = 0.05 + (progress * 0.04);
            if (beatIndex % 2 === 0) {
                tone(1200 + (proceduralSeed * 400), 'triangle', 0, 0.04, clickVol, 400, 3500); 
            } else {
                tone(180, 'sine', 0, 0.08, clickVol * 1.4, 70, 600); 
            }
        }

        beatIndex++;
        ambientInterval = setTimeout(playBeatStep, 460);
    }
    playBeatStep();
}

// Bei jeder Interaktion wird die Kulisse neu durchgemischt
function playPop() {
    shiftProceduralMusic();
    const popFreq = 540 + (Math.random() * 120);
    tone(popFreq, 'sine', 0, 0.08, 0.22, popFreq + 100, 2500); 
    tone(popFreq * 2, 'triangle', 0.02, 0.04, 0.09, popFreq * 2, 3000); 
}

function playClick() { 
    shiftProceduralMusic();
    tone(280 + (Math.random() * 60), 'triangle', 0, 0.05, 0.25, 340, 1500); 
}

function playPartial() {
    shiftProceduralMusic();
    const harmonyNotes = [440, 554, 659].map(n => n * (1 + (Math.random() * 0.02)));
    harmonyNotes.forEach((freq, i) => { 
        tone(freq, 'triangle', i * 0.08, 0.2, 0.18, freq * 1.02, 2200); 
    });
}

function playWrong() {
    shiftProceduralMusic();
    errorDamping = 1.0; 
    tone(190, 'sawtooth', 0, 0.35, 0.35, 80, 800);
    tone(130, 'triangle', 0.08, 0.3, 0.25, 50, 600);
}

function playStarSound() {
    const starNotes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
    starNotes.forEach((freq, i) => {
        tone(freq, 'sine', i * 0.05, 0.2, 0.16, freq * 1.01, 3500);
    });
}

// ── Musik-Schalter ────────────────────────────────────────────────
const musicToggleBtn = document.getElementById('musicToggleBtn');
musicToggleBtn.addEventListener('click', () => {
    musicEnabled = !musicEnabled;
    if (musicEnabled) {
        musicToggleBtn.textContent = 'Musik an';
        if (ambientStarted && !ambientInterval) startAmbientMusic();
    } else {
        musicToggleBtn.textContent = 'Musik aus';
        if (ambientInterval) { clearTimeout(ambientInterval); ambientInterval = null; }
    }
    playClick();
});

// ── Datei-Einlesen ────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { lastFileData = ev.target.result; processData(lastFileData); };
    reader.readAsText(file, 'UTF-8');
});

function processData(data) {
    sentences = data.split(/\r?\n/).map(t => t.trim()).filter(t => t.length > 0);
    current = 0;
    setMascotMood(false);
    triggerMascotAnimation('jump');
    updateMascot(getRandomElement(greetings));
    showSentence();
}

// ── Texteingabe ───────────────────────────────────────────────────
const textInputBtn = document.getElementById('textInputBtn');
const textModal = document.getElementById('textModal');
const textInputArea = document.getElementById('textInputArea');
const applyTextBtn = document.getElementById('applyTextBtn');
const closeTextBtn = document.getElementById('closeTextBtn');

textInputBtn.addEventListener('click', () => { textModal.style.display = 'flex'; textInputArea.focus(); });
closeTextBtn.addEventListener('click', () => { textModal.style.display = 'none'; });
textModal.addEventListener('click', (e) => { if (e.target === textModal) textModal.style.display = 'none'; });

applyTextBtn.addEventListener('click', () => {
    const text = textInputArea.value.trim();
    if (!text) { alert('Bitte einen Satz eingeben.'); return; }
    lastFileData = text;
    processData(text);
    textModal.style.display = 'none';
    playClick();
});

// ── Spiel-Logik ───────────────────────────────────────────────────
function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }
window.onload = () => { lastFileData = sentences[0]; showSentence(); };

function updateMascot(text) { document.getElementById('mascot-text').textContent = text; }

function setMascotMood(isSad) {
    const img = document.getElementById('mascot-image');
    if (isSad) { img.classList.add('is-sad'); } else { img.classList.remove('is-sad'); }
}

function showSentence() {
    const game     = document.getElementById('game');
    const checkBtn = document.getElementById('checkBtn');
    game.innerHTML = '';
    document.getElementById('mascot-container').classList.remove('has-heart');

    if (current >= sentences.length) {
        setMascotMood(false);
        triggerMascotAnimation('jump');
        updateMascot("Ausgezeichnet. Du hast alle Sätze richtig gemacht. Du bist ein Deutsch-Profi.");
        game.innerHTML = '<h3>Super. Alle Sätze gelöst.</h3>';
        const btn = document.createElement('button');
        btn.className = 'restart-btn';
        btn.innerHTML = 'Nochmal spielen';
        btn.onclick = () => { current = 0; processData(lastFileData); };
        game.appendChild(btn);
        checkBtn.style.display = 'none';
        return;
    }

    checkBtn.style.display = 'block';
    const correct = sentences[current];
    const words   = shuffle(correct.split(/\s+/));

    const progress = document.createElement('div');
    progress.className = 'progress';
    progress.textContent = `Satz ${current + 1} von ${sentences.length}`;
    game.appendChild(progress);

    if (current > 0) {
        setMascotMood(false);
        updateMascot(`Weiter geht es. Hier ist Satz Nummer ${current + 1}:`);
    }

    const poolLabel = document.createElement('strong');
    poolLabel.textContent = 'Bring die Wörter in die richtige Reihenfolge:';
    game.appendChild(poolLabel);

    const pool = createZone('pool');
    pool.dataset.correct = correct;
    words.forEach(word => pool.appendChild(createWord(word)));
    game.appendChild(pool);
}

function createWord(text) {
    const el = document.createElement('div');
    el.className = 'word';
    el.textContent = text;
    addDragEvents(el);
    return el;
}

function createZone(type) {
    const zone = document.createElement('div');
    zone.className = 'container ' + type;

    zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('drag-over');
        if (!mouseSource) return;
        const toMove = getMovable(mouseSource);
        const after  = getDragAfterElement(zone, e.clientX, e.clientY);
        flipInsert(zone, toMove, after);
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        playPop();
        mouseSource = null;
    });
    return zone;
}

let mouseSource = null;

function addDragEvents(el) {
    el.draggable = true;
    el.addEventListener('dragstart', (e) => {
        mouseSource = el;
        initAudio();
        setTimeout(() => getMovable(el).classList.add('dragging-source'), 0);
    });
    el.addEventListener('dragend', () => {
        if (mouseSource) getMovable(mouseSource).classList.remove('dragging-source');
        mouseSource = null;
    });
    addTouchDrag(el);
}

function addTouchDrag(el) {
    let ghost = null;
    let touchSource = null;
    let offsetX = 0, offsetY = 0;

    el.addEventListener('touchstart', (e) => {
        initAudio();
        touchSource = el;
        const movable = getMovable(el);
        const touch   = e.touches[0];
        const rect    = movable.getBoundingClientRect();

        offsetX = touch.clientX - rect.left;
        offsetY = touch.clientY - rect.top;

        ghost = movable.cloneNode(true);
        ghost.classList.add('touch-ghost');
        ghost.style.width  = rect.width  + 'px';
        ghost.style.left   = (touch.clientX - offsetX) + 'px';
        ghost.style.top    = (touch.clientY - offsetY) + 'px';
        document.body.appendChild(ghost);

        movable.classList.add('dragging-source');
    }, { passive: true });

    el.addEventListener('touchmove', (e) => {
        if (!touchSource || !ghost) return;
        e.preventDefault();
        const touch = e.touches[0];

        ghost.style.left = (touch.clientX - offsetX) + 'px';
        ghost.style.top  = (touch.clientY - offsetY) + 'px';
        ghost.style.visibility = 'hidden';
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        ghost.style.visibility = 'visible';

        const zone = target && target.closest('.container');
        if (!zone) return;

        document.querySelectorAll('.container').forEach(z => z.classList.remove('drag-over'));
        zone.classList.add('drag-over');

        const movable = getMovable(touchSource);
        const after   = getDragAfterElement(zone, touch.clientX, touch.clientY);
        flipInsert(zone, movable, after);
    }, { passive: false });

    const endTouch = () => {
        if (ghost) { ghost.remove(); ghost = null; }
        if (touchSource) {
            getMovable(touchSource).classList.remove('dragging-source');
            touchSource = null;
        }
        document.querySelectorAll('.container').forEach(z => z.classList.remove('drag-over'));
        playPop();
    };
    el.addEventListener('touchend',    endTouch);
    el.addEventListener('touchcancel', endTouch);
}

function getMovable(el) {
    const p = el.parentElement;
    return (p && p.classList.contains('group')) ? p : el;
}

function flipInsert(container, toMove, after) {
    const children = [...container.querySelectorAll('.word:not(.group .word), .group')].filter(el => el !== toMove);
    const first = new Map();
    children.forEach(el => {
        const r = el.getBoundingClientRect();
        first.set(el, { x: r.left, y: r.top });
    });

    if (after == null) container.appendChild(toMove);
    else container.insertBefore(toMove, after);

    children.forEach(el => {
        const f = first.get(el);
        if (!f) return;
        const l = el.getBoundingClientRect();
        const dx = f.x - l.left;
        const dy = f.y - l.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
        el.style.transition = 'none';
        el.style.transform  = `translate(${dx}px, ${dy}px)`;
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                el.style.transition = '';
                el.style.transform  = '';
            });
        });
    });
}

function getDragAfterElement(container, x, y) {
    const items = [...container.querySelectorAll('.word:not(.group .word), .group:not(.dragging-source)')];
    if (items.length === 0) return null;

    const rows = [];
    items.forEach(el => {
        const box = el.getBoundingClientRect();
        const mid = box.top + box.height / 2;
        let row = rows.find(r => Math.abs(r.mid - mid) < box.height * 0.6);
        if (!row) { row = { mid, els: [] }; rows.push(row); }
        row.els.push(el);
    });
    rows.sort((a, b) => a.mid - b.mid);

    let bestRow = rows[0];
    let bestDist = Infinity;
    rows.forEach(r => {
        const d = Math.abs(r.mid - y);
        if (d < bestDist) { bestDist = d; bestRow = r; }
    });

    const sorted = bestRow.els.slice().sort((a, b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left);
    for (const el of sorted) {
        const box = el.getBoundingClientRect();
        if (x < box.left + box.width / 2) return el;
    }
    const rowIdx = rows.indexOf(bestRow);
    if (rowIdx < rows.length - 1) {
        const nextSorted = rows[rowIdx + 1].els.slice().sort((a, b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left);
        return nextSorted[0];
    }
    return null;
}

function normalize(text) { return text.replace(/[.,!?;:]/g, '').replace(/\s+/g, ' ').trim(); }

function checkSentence() {
    const pool    = document.querySelector('.pool');
    if (!pool) return;

    const wordsInOrder = [...pool.querySelectorAll('.word')].map(w => w.textContent);
    const correctStr   = pool.dataset.correct;

    if (normalize(wordsInOrder.join(' ')) === normalize(correctStr)) {
        setMascotMood(false);
        triggerMascotAnimation('jump');
        updateMascot(getRandomElement(correctComments));
        document.getElementById('mascot-container').classList.add('has-heart');
        playStarSound();
        setTimeout(() => { current++; showSentence(); }, 2400);
    } else {
        let anyMatch = false;
        while (updateGroupsOnce(pool, correctStr)) { anyMatch = true; }
        
        if (anyMatch) {
            setMascotMood(false);
            triggerMascotAnimation('jump');
            updateMascot(getRandomElement(partialComments));
            playPartial(); 
        } else {
            setMascotMood(true);
            triggerMascotAnimation('shake');
            updateMascot(getRandomElement(wrongComments));
            playWrong(); 
        }
    }
}

function getElementWords(el) {
    if (el.classList.contains('word')) { return [el.textContent]; }
    else { return [...el.querySelectorAll('.word')].map(w => w.textContent); }
}

function updateGroupsOnce(answer, correctStr) {
    const correctWords = correctStr.split(/\s+/);
    const topLevelElements = [...answer.querySelectorAll('.word:not(.group .word), .group')];

    function findMatchingStart(words, usedRanges = []) {
        for (let start = 0; start <= correctWords.length - words.length; start++) {
            let matches = true;
            for (let j = 0; j < words.length; j++) {
                if (normalize(words[j]) !== normalize(correctWords[start + j])) { matches = false; break; }
            }
            if (!matches) continue;
            let overlaps = false;
            for (const r of usedRanges) {
                const end = start + words.length - 1;
                if (!(end < r.start || start > r.end)) { overlaps = true; break; }
            }
            if (!overlaps) return start;
        }
        return -1;
    }

    const usedRanges = [];
    topLevelElements.forEach(el => {
        if (el.classList.contains('group')) {
            const start = parseInt(el.dataset.start);
            const end = parseInt(el.dataset.end);
            if (!isNaN(start) && !isNaN(end)) { usedRanges.push({ start, end }); }
        }
    });

    for (let i = 0; i < topLevelElements.length - 1; i++) {
        const leftEl = topLevelElements[i];
        const rightEl = topLevelElements[i + 1];
        const leftWords = getElementWords(leftEl);
        const rightWords = getElementWords(rightEl);
        const combinedWords = [...leftWords, ...rightWords];

        let valid = false;
        let startIndex = -1;

        if (leftEl.classList.contains('group') && rightEl.classList.contains('group')) {
            const leftEnd = parseInt(leftEl.dataset.end);
            const rightStart = parseInt(rightEl.dataset.start);
            if (leftEnd + 1 === rightStart) { valid = true; startIndex = parseInt(leftEl.dataset.start); }
        } else if (leftEl.classList.contains('group')) {
            const leftEnd = parseInt(leftEl.dataset.end);
            const tempRanges = usedRanges.filter(r => !(r.start === parseInt(leftEl.dataset.start) && r.end === parseInt(leftEl.dataset.end)));
            const pos = findMatchingStart(rightWords, tempRanges);
            if (pos === leftEnd + 1) { valid = true; startIndex = parseInt(leftEl.dataset.start); }
        } else if (rightEl.classList.contains('group')) {
            const rightStart = parseInt(rightEl.dataset.start);
            const tempRanges = usedRanges.filter(r => !(r.start === parseInt(rightStart) && r.end === parseInt(rightEl.dataset.end)));
            const pos = findMatchingStart(leftWords, tempRanges);
            if (pos + leftWords.length === rightStart) { valid = true; startIndex = pos; }
        } else {
            startIndex = findMatchingStart(combinedWords, usedRanges);
            if (startIndex !== -1) { valid = true; }
        }

        if (!valid) continue;
        let group;

        if (leftEl.classList.contains('group')) {
            group = leftEl;
            if (rightEl.classList.contains('group')) {
                [...rightEl.querySelectorAll('.word')].forEach(w => group.appendChild(w));
                group.dataset.end = rightEl.dataset.end;
                rightEl.remove();
            } else {
                group.appendChild(rightEl);
                group.dataset.end = parseInt(group.dataset.end) + rightWords.length;
            }
        } else if (rightEl.classList.contains('group')) {
            group = rightEl;
            group.insertBefore(leftEl, group.firstChild);
            group.dataset.start = startIndex;
        } else {
            group = document.createElement('div');
            group.className = 'group';
            group.dataset.start = startIndex;
            group.dataset.end = startIndex + combinedWords.length - 1;
            addTouchDrag(group);
            group.draggable = true;

            group.addEventListener('dragstart', (e) => {
                mouseSource = group.querySelector('.word');
                initAudio();
                setTimeout(() => group.classList.add('dragging-source'), 0);
            });
            group.addEventListener('dragend', () => { group.classList.remove('dragging-source'); mouseSource = null; });

            answer.insertBefore(group, leftEl);
            group.appendChild(leftEl);
            group.appendChild(rightEl);
        }

        [...answer.querySelectorAll('.group')].forEach(g => { if (g.children.length === 0) g.remove(); });
        return true;
    }
    return false;
}
