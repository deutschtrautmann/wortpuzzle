    :root {
        --font-comic: 'Comic Neue Embedded', 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', cursive, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        padding: 0;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        margin: 0;
        background: #f9fbfd;
        color: #333;
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
        
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
    }

    
    textarea, input[type="text"] {
        -webkit-user-select: text;
        -moz-user-select: text;
        user-select: text;
    }

    #spieltitel {
        margin: 0 0 18px 0;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    
    .thema-select {
        flex: 1 1 90px;
        max-width: 120px;
        height: 34px;
        background: #fff;
        border: 2px solid #b7c7dd;
        border-radius: 10px;
        padding: 0 6px;
        font-size: clamp(10px, 2.6vw, 12px);
        font-weight: 700;
        color: #2c3e6b;
        box-sizing: border-box;
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        cursor: pointer;
        touch-action: manipulation;
    }
    .thema-select:focus { outline: none; border-color: #4a90d9; }

    
    .icon-plain-button {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        min-width: 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        box-shadow: none;
        border-radius: 8px;
        padding: 4px;
        margin: 0 0 0 auto;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        color: #6b7c99;
        position: static;
        overflow: visible;
    }
    
    .icon-plain-button::before { content: none; }
    .icon-plain-button svg { width: 100%; height: 100%; display: block; }
    .icon-plain-button:active { opacity: 0.6; }
    @media (hover: hover) {
        .icon-plain-button:hover { color: #4a90d9; }
    }

    #themaBox {
        margin-bottom: 14px;
    }

    #themaLabel {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #667;
        margin-bottom: 6px;
    }

    #themaInputArea {
        width: 100%;
        border: 2px solid #b7c7dd;
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 16px;
        font-family: inherit;
        box-sizing: border-box;
    }

    #spieltitel .titel-icon {
        font-size: 1em;
        line-height: 1;
        user-select: none;
        -webkit-text-fill-color: initial;
        display: inline;
    }

    #spieltitel h1 {
        margin: 0;
        font-size: clamp(22px, 6vw, 34px);
        font-weight: 800;
        letter-spacing: 0px;
        line-height: 1.1;
        background: linear-gradient(135deg, #2c7be5 0%, #38c172 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    #spieltitel .titel-untertitel {
        font-size: clamp(10px, 2.5vw, 13px);
        color: #94a3b8;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-top: 1px;
    }

    .container {
        min-height: 70px;
        border: 3px dashed #ccc;
        border-radius: 16px;
        padding: 14px;
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        background: #fff;
        align-content: flex-start;
    }
    .pool { background: #dfefff; border-color: #90c0f0; }

    
    @keyframes solvedBlink {
        0%, 100% { box-shadow: none; border-color: inherit; }
        50% {
            box-shadow: 0 0 0 4px rgba(76,175,80,0.45), 0 0 20px rgba(76,175,80,0.5);
            border-color: #4CAF50;
        }
    }
    .pool.solved-blink {
        animation: solvedBlink 0.4s ease-in-out 5;
    }

    .container.drag-over {
        border-color: #4CAF50;
        background: rgba(76, 175, 80, 0.07);
    }

    
    .word {
        
        font-family: var(--font-comic);
        font-size-adjust: 0.56;
        --wa: #ffffff; --wb: #edf2fc; --wc: #c9d4ec; --wbd: #a9b7d8;
        background:
            radial-gradient(ellipse 36% 24% at 24% 24%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.95) 45%, rgba(255,255,255,0) 100%),
            radial-gradient(ellipse 95% 130% at 50% 28%, var(--wa) 0%, var(--wb) 55%, var(--wc) 100%);
        color: #000;
        padding: clamp(10px, 3vw, 14px) clamp(16px, 4.5vw, 24px);
        border-radius: 999px;
        box-shadow: inset 0 -4px 7px rgba(0,0,0,0.10), 0 3px 6px rgba(0,0,0,0.18);
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        border: 2px solid var(--wbd);
        font-size: clamp(14px, 3.5vw, 17px);
        font-weight: 700;
        display: inline-block;
        touch-action: none;
        transition: box-shadow 0.15s, transform 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        will-change: transform;
        
        min-height: 44px;
        display: inline-flex;
        align-items: center;
    }
    .word:active { cursor: grabbing; }

    
    .group {
        color: #000;
        display: inline-flex;
        flex-wrap: wrap;
        align-items: stretch;
        align-content: flex-start;
        justify-content: flex-start;
        row-gap: 6px;
        column-gap: 0;
        max-width: 100%;
        min-width: 0;
        background: none;
        border: none;
        box-shadow: none;
        padding: 0;
        cursor: grab;
        touch-action: none;
        position: relative;
        transition: transform 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        will-change: transform;
    }
    .group .word {
        white-space: nowrap;
        flex: 0 0 auto;
        cursor: inherit;
    }
    
    .group { --ov: 8px; padding-right: var(--ov); row-gap: 8px; }
    .group .word { margin-right: calc(-1 * var(--ov)); }

    
    .group {
        --gbg: hsl(var(--gh, 210) var(--gs, 90%) var(--gl, 65%));
        --gbd: hsl(var(--gh, 210) var(--gs, 90%) calc(var(--gl, 65%) - 22%));
        --gtop: hsl(var(--gh, 210) var(--gs, 90%) calc(var(--gl, 65%) + 14%));
        --gbot: hsl(var(--gh, 210) var(--gs, 90%) calc(var(--gl, 65%) - 9%));
    }
    .group .word {
        position: relative;
        white-space: nowrap;
        padding-left: max(16px, clamp(16px, 4.5vw, 24px));
        padding-right: max(16px, clamp(16px, 4.5vw, 24px));
        background:
            radial-gradient(ellipse 36% 24% at 24% 24%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.9) 45%, rgba(255,255,255,0) 100%),
            radial-gradient(ellipse 95% 130% at 50% 28%, var(--gtop) 0%, var(--gbg) 55%, var(--gbot) 100%);
        border-color: var(--gbd);
        box-shadow: inset 0 -5px 8px rgba(0,0,0,0.14), 0 3px 6px rgba(0,0,0,0.22);
        transform-origin: 50% 100%;   
        
        animation-name: puyoJoin, puyoIdle;
        animation-duration: 0.7s, 2.6s;
        animation-timing-function: ease-out, ease-in-out;
        animation-delay: calc(var(--n, 0) * 0.05s), calc(0.75s + var(--n, 0) * 0.12s);
        animation-iteration-count: 1, infinite;
        animation-fill-mode: backwards, none;
    }
    
    .group .word.link-prev::before {
        content: '';
        position: absolute;
        top: 14%;
        bottom: 14%;
        left: calc(-1.25 * var(--ov));
        width: calc(3.5 * var(--ov));
        
        background: radial-gradient(ellipse closest-side at 50% 50%, var(--gbg) 0%, var(--gbg) 62%, transparent 100%);
        z-index: 1;
        pointer-events: none;
    }
    @keyframes puyoJoin {
        0%   { transform: scale(1, 1); }
        18%  { transform: scale(1.28, 0.70); }
        36%  { transform: scale(0.86, 1.22); }
        54%  { transform: scale(1.10, 0.92); }
        74%  { transform: scale(0.97, 1.04); }
        100% { transform: scale(1, 1); }
    }
    @keyframes puyoIdle {
        0%, 100% { transform: scale(1, 1); }
        50%      { transform: scale(1.025, 0.96); }
    }
    
    @keyframes puyoCheer {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        22%      { transform: translateY(0) scale(1.18, 0.80); }
        55%      { transform: translateY(-16px) scale(0.90, 1.14); }
        80%      { transform: translateY(0) scale(1.10, 0.90); }
    }
    .pool.solved-blink .word {
        transform-origin: 50% 100%;
        animation: puyoCheer 0.66s ease-in-out calc(var(--n, 0) * 0.06s) 3;
    }
    
    .pool.finale.solved-blink .word { animation-iteration-count: 1; }
    
    @keyframes puyoSettle {
        0%   { transform: scale(1.05, 0.94); }
        28%  { transform: scale(0.98, 1.03); }
        55%  { transform: scale(1.012, 0.99); }
        80%  { transform: scale(0.996, 1.004); }
        100% { transform: scale(1, 1); }
    }
    .pool.settled .word {
        transform-origin: 50% 100%;
        animation: puyoSettle 1.3s ease-out calc(var(--n, 0) * 0.05s) 1 backwards;
    }
    
    .puyo-bit {
        position: absolute;
        border-radius: 50%;
        z-index: 3;

    }
    @keyframes puyoBit {
