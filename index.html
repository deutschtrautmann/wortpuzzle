<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Wörterpuzzle</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        padding: 0;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        margin: 0;
        background: #f9fbfd;
        color: #333;
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
        /* Verhindert unerwünschte Text-Selektion beim Drag auf Desktop */
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
    }

    /* Texteingaben dürfen weiterhin selektierbar sein */
    textarea, input[type="text"] {
        -webkit-user-select: text;
        -moz-user-select: text;
        user-select: text;
    }

    #spieltitel {
        margin: 0 0 18px 0;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #spieltitel .titel-icon {
        font-size: 1em;
        line-height: 1;
        user-select: none;
        -webkit-text-fill-color: initial;
        display: inline;
    }

    #spieltitel h1 {
        margin: 0;
        font-size: clamp(22px, 6vw, 34px);
        font-weight: 800;
        letter-spacing: 0px;
        line-height: 1.1;
        background: linear-gradient(135deg, #2c7be5 0%, #38c172 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    #spieltitel .titel-untertitel {
        font-size: clamp(10px, 2.5vw, 13px);
        color: #94a3b8;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-top: 1px;
    }

    .container {
        min-height: 70px;
        border: 3px dashed #ccc;
        border-radius: 16px;
        padding: 14px;
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        background: #fff;
        align-content: flex-start;
    }
    .pool { background: #dfefff; border-color: #90c0f0; }

    .container.drag-over {
        border-color: #4CAF50;
        background: rgba(76, 175, 80, 0.07);
    }

    .word {
        background: white;
        padding: clamp(10px, 3vw, 14px) clamp(14px, 4vw, 22px);
        border-radius: 12px;
        box-shadow: 0 3px 7px rgba(0,0,0,0.12);
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        border: 1px solid #ddd;
        font-size: clamp(14px, 3.5vw, 17px);
        display: inline-block;
        touch-action: none;
        transition: box-shadow 0.15s, transform 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        will-change: transform;
        /* Mindest-Touch-Ziel 44px */
        min-height: 44px;
        display: inline-flex;
        align-items: center;
    }
    .word:active { cursor: grabbing; }

    .group {
        display: flex;
        gap: 6px;
        border: 3px solid #4CAF50;
        border-radius: 18px;
        padding: 7px 10px;
        background: rgba(76, 175, 80, 0.07);
        align-items: center;
        flex-wrap: wrap;
        cursor: grab;
        touch-action: none;
        position: relative;
        transition: transform 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        will-change: transform;
    }

    .touch-ghost {
        position: fixed;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.85;
        transform: scale(1.08);
        box-shadow: 0 8px 24px rgba(0,0,0,0.22);
        border-radius: 12px;
        transition: none;
    }
    .dragging-source { opacity: 1; color: #000; }

    #app-box {
        background: #fff;
        border: none;
        border-radius: 0;
        padding: 16px;
        padding-left: max(16px, env(safe-area-inset-left, 16px));
        padding-right: max(16px, env(safe-area-inset-right, 16px));
        padding-top: max(16px, env(safe-area-inset-top, 16px));
        min-height: 100vh;
        min-height: 100dvh; /* dynamic viewport height für mobile Browser */
        box-shadow: none;
    }

    button {
        margin-top: 15px;
        width: 100%;
        max-width: 340px;
        padding: clamp(14px, 4vw, 18px);
        font-size: clamp(16px, 4.5vw, 20px);
        border: none;
        border-radius: 15px;
        background: #4CAF50;
        color: white;
        cursor: pointer;
        display: block;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        /* Verhindert Double-Tap-Zoom auf iOS */
        touch-action: manipulation;
        /* Mindest-Touch-Ziel */
        min-height: 48px;
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }
    button:active { filter: brightness(0.9); }
    /* Hover nur auf echten Zeige-Geräten (nicht Touchscreen) */
    @media (hover: hover) {
        button:hover { filter: brightness(1.05); }
    }
    .restart-btn { background: #3498db; }

    #fileLabel {
        display: inline-block;
        background: #e8f0fe;
        border: 2px solid #4a90d9;
        border-radius: 14px;
        padding: 0 10px;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 12px;
        touch-action: manipulation;
    }
    #fileInput { display: none; }

    .progress {
        font-size: clamp(12px, 3vw, 14px);
        color: #888;
        margin-bottom: 4px;
    }

    .top-controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }

    .top-button,
    #fileLabel {
        /* Flexibel statt fix 122px – passt sich kleinen Screens an */
        flex: 1 1 100px;
        max-width: 150px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #e8f0fe;
        border: 2px solid #4a90d9;
        border-radius: 14px;
        padding: 0 10px;
        font-size: clamp(12px, 3vw, 14px);
        cursor: pointer;
        color: #333;
        box-sizing: border-box;
        margin: 0;
        line-height: 1;
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        text-align: center;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        white-space: nowrap;
    }

    @media (hover: hover) {
        .top-button:hover,
        #fileLabel:hover { background: #dce8fd; }
    }

    #textModal {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0; /* Fallback für ältere Browser */
        inset: 0; /* Modern */
        background: rgba(0,0,0,0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 16px;
        padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
        /* Scroll bei überlangem Modal-Inhalt (kleines Handy + Tastatur offen) */
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    #textModalContent {
        background: white;
        width: 100%;
        max-width: 720px;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        /* Modal soll nicht über den Bildschirm hinausgehen */
        max-height: 90vh;
        max-height: 90dvh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    #textInputArea {
        width: 100%;
        min-height: 200px;
        border: 2px solid #b7c7dd;
        border-radius: 12px;
        padding: 14px;
        /* Mindestens 16px – verhindert Auto-Zoom auf iOS Safari */
        font-size: 16px;
        resize: vertical;
        font-family: inherit;
        /* Eigenes Scrollverhalten auf iOS */
        -webkit-overflow-scrolling: touch;
    }

    .modal-buttons {
        display: flex;
        gap: 12px;
        margin-top: 16px;
        flex-wrap: wrap;
    }

    .modal-buttons button { max-width: 220px; margin-top: 0; }
    .secondary-btn { background: #7f8c8d; }

    /* ── Maskottchen Bereich (Schaf) ────────────────────────── */
    #mascot-container {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
        margin-bottom: 5px;
        padding: 12px;
        background: #f4f9f4;
        border-radius: 18px;
        border: 2px solid #c2e0c2;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    #mascot-image {
        width: clamp(60px, 15vw, 90px);
        height: clamp(67px, 16vw, 100px);
        flex-shrink: 0;
        transform-origin: bottom center;
        animation: floatMascot 4s ease-in-out infinite;
    }

    .sheep-svg {
        width: 100%;
        height: 100%;
    }

    .eye-happy, .mouth-happy { display: block; }
    .eye-sad, .mouth-sad { display: none; }

    .is-sad .eye-happy { display: none; }
    .is-sad .eye-sad { display: block; }
    .is-sad .mouth-happy { display: none; }
    .is-sad .mouth-sad { display: block; }

    #mascot-heart {
        display: none;
        transform-origin: 50px 72px;
        animation: heartPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .has-heart #mascot-heart {
        display: block;
    }
    .has-heart #left-arm {
        transform: rotate(25deg) translate(2px, -4px) !important;
        animation: none !important;
    }
    .has-heart #right-arm {
        transform: rotate(-25deg) translate(-2px, -4px) !important;
        animation: none !important;
    }

    @keyframes heartPop {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .animate-jump {
        animation: jumpMascot 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards !important;
    }

    .animate-shake {
        animation: shakeMascot 0.5s ease-in-out forwards !important;
    }

    #mascot-speech-bubble {
        background: #fff;
        padding: 12px 18px;
        border-radius: 14px;
        position: relative;
        border: 1px solid #d4ebd4;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        flex-grow: 1;
    }

    #mascot-speech-bubble::after {
        content: '';
        position: absolute;
        left: -10px;
        top: 30px;
        border-width: 6px 10px 6px 0;
        border-style: solid;
        border-color: transparent white transparent transparent;
    }

    #mascot-text {
        margin: 0;
        font-size: clamp(13px, 3.5vw, 16px);
        line-height: 1.4;
        font-weight: 500;
        color: #2c3e50;
    }

    .blink-pupil {
        animation: blinkAnimation 5s infinite;
        transform-origin: center;
    }
    @keyframes blinkAnimation {
        0%, 95%, 100% { transform: scaleY(1); opacity: 1; }
        97% { transform: scaleY(0.1); opacity: 0.1; }
    }

    #left-leg {
        animation: stepLeft 3s infinite ease-in-out;
        transform-origin: top center;
    }
    #right-leg {
        animation: stepRight 3s infinite ease-in-out;
        transform-origin: top center;
    }
    @keyframes stepLeft {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
    }
    @keyframes stepRight {
        0%, 100% { transform: translateY(-2px); }
        50% { transform: translateY(0); }
    }

    #left-arm {
        animation: waveLeft 4s infinite ease-in-out;
        transform-origin: 32px 58px;
    }
    #right-arm {
        animation: waveRight 4s infinite ease-in-out;
        transform-origin: 68px 58px;
    }
    @keyframes waveLeft {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-5deg); }
    }
    @keyframes waveRight {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(5deg); }
    }

    @keyframes floatMascot {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
    }

    @keyframes jumpMascot {
        0% { transform: translateY(0) scale(1); }
        20% { transform: translateY(2px) scaleY(0.9); }
        50% { transform: translateY(-20px) scaleY(1.1); }
        80% { transform: translateY(0) scaleY(0.95); }
        100% { transform: translateY(0) scale(1); }
    }

    @keyframes shakeMascot {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
    }

    /* ── Responsive Breakpoints ──────────────────────────────── */

    /* Kleine Handys (bis 380px) */
    @media (max-width: 380px) {
        .top-controls { gap: 6px; }
        .top-button, #fileLabel { font-size: 11px; padding: 0 7px; }
        #app-box { padding: 12px; }
    }

    /* Querformat auf Handy – Mascot kleiner damit Spielfläche passt */
    @media (max-height: 500px) and (orientation: landscape) {
        #mascot-container { padding: 8px; gap: 8px; }
        #mascot-image { width: 50px; height: 56px; }
        #mascot-text { font-size: 12px; }
    }

    /* Tablet & Desktop – zentriertes Layout mit max-width */
    @media (min-width: 700px) {
        #app-box {
            max-width: 800px;
            margin: 0 auto;
            padding: 28px 32px;
            min-height: unset;
            margin-top: 20px;
            margin-bottom: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        body { background: #eef2f7; }
    }
</style>
</head>
<body>
<div id="app-box">

<div id="spieltitel">
    <div>
        <h1>Wörter<span class="titel-icon">🧩</span>Puzzle</h1>
        <div class="titel-untertitel">Wörter in die richtige Reihenfolge bringen</div>
    </div>
</div>

<div class="top-controls">
    <label id="fileLabel" class="top-button" for="fileInput"></label>
    <div id="textInputBtn" class="top-button"></div>
    <div id="musicToggleBtn" class="top-button"></div>
</div>

<input type="file" id="fileInput" accept=".txt">

<div id="textModal">
    <div id="textModalContent">
        <h3 id="modalTitel"></h3>
        <p id="modalHinweis"></p>
        <textarea id="textInputArea"></textarea>

        <div class="modal-buttons">
            <button id="applyTextBtn"></button>
            <button id="closeTextBtn" class="secondary-btn"></button>
        </div>
    </div>
</div>

<div id="mascot-container">
    <div id="mascot-image">
        <svg class="sheep-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
            <g id="left-leg">
                <rect x="33" y="85" width="10" height="15" rx="3" fill="#d0d0d0"/>
                <path d="M 33 95 L 43 95 L 43 100 L 33 100 Z" fill="#4a4a4a"/>
            </g>
            <g id="right-leg">
                <rect x="57" y="85" width="10" height="15" rx="3" fill="#d0d0d0"/>
                <path d="M 57 95 L 67 95 L 67 100 L 57 100 Z" fill="#4a4a4a"/>
            </g>
            
            <path d="M 30 30 Q 10 20 15 40 Q 20 45 32 38" fill="none" stroke="#e8c7e8" stroke-width="7" stroke-linecap="round"/>
            <path d="M 70 30 Q 90 20 85 40 Q 80 45 68 38" fill="none" stroke="#e8c7e8" stroke-width="7" stroke-linecap="round"/>

            <ellipse cx="23" cy="35" rx="5" ry="9" fill="#fce4ec" transform="rotate(-30 23 35)"/>
            <ellipse cx="77" cy="35" rx="5" ry="9" fill="#fce4ec" transform="rotate(30 77 35)"/>

            <circle cx="50" cy="58" r="32" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
            <circle cx="30" cy="45" r="12" fill="#ffffff"/>
            <circle cx="70" cy="45" r="12" fill="#ffffff"/>
            <circle cx="50" cy="38" r="14" fill="#ffffff"/>
            <circle cx="25" cy="65" r="12" fill="#ffffff"/>
            <circle cx="75" cy="65" r="12" fill="#ffffff"/>
            <circle cx="40" cy="80" r="12" fill="#ffffff"/>
            <circle cx="60" cy="80" r="12" fill="#ffffff"/>

            <ellipse cx="50" cy="48" rx="18" ry="16" fill="#ffffff"/>
            
            <g id="mascot-heart">
                <path d="M 50 78 C 44 70, 36 70, 36 77 C 36 84, 44 88, 50 94 C 56 88, 64 84, 64 77 C 64 70, 56 70, 50 78 Z" fill="#ff4d4d"/>
            </g>

            <g id="left-arm">
                <path d="M 32 58 Q 42 68 46 64" fill="none" stroke="#d0d0d0" stroke-width="6" stroke-linecap="round"/>
                <path d="M 43 61 L 46 64 L 42 67 Z" fill="#4a4a4a"/>
            </g>
            <g id="right-arm">
                <path d="M 68 58 Q 58 68 54 64" fill="none" stroke="#d0d0d0" stroke-width="6" stroke-linecap="round"/>
                <path d="M 57 61 L 54 64 L 58 67 Z" fill="#4a4a4a"/>
            </g>

            <g class="eye-happy">
                <circle class="blink-pupil" cx="43" cy="46" r="2.5" fill="#333"/>
                <circle class="blink-pupil" cx="57" cy="46" r="2.5" fill="#333"/>
                <path d="M 39 41 Q 43 40 45 42" fill="none" stroke="#333" stroke-width="1"/>
                <path d="M 61 41 Q 57 40 55 42" fill="none" stroke="#333" stroke-width="1"/>
            </g>
            <path class="mouth-happy" d="M 46 54 Q 50 58 54 54" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

            <g class="eye-sad">
                <path d="M 40 48 Q 43 44 46 47" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                <path d="M 60 48 Q 57 44 54 47" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
            </g>
            <path class="mouth-sad" d="M 47 57 Q 50 54 53 57" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

            <path d="M 48 51 L 52 51 L 50 53 Z" fill="#555"/>
        </svg>
    </div>
    <div id="mascot-speech-bubble">
        <p id="mascot-text"></p>
    </div>
</div>

<div id="game"></div>
<button id="checkBtn" onclick="checkSentence()"></button>

</div>

<script>
// ════════════════════════════════════════════════════════════════
// TEXTE – Alle angezeigten Texte des Spiels zentral anpassen
// ════════════════════════════════════════════════════════════════
const TEXTE = {

    // Beispiel-Sätze beim ersten Start (eine Zeile = ein Satz)
    beispiel: "eins zwei drei vier fünf sechs sieben acht neun zehn elf zwölf",

    // Obere Schaltflächen
    btnDatei:      "Textdatei",
    btnEingabe:    "Texteingabe",
    btnMusikAn:    "Musik an",
    btnMusikAus:   "Musik aus",

    // Text-Eingabe-Modal
    modalTitel:       "Text oder Sätze eingeben",
    modalHinweis:     "Jede Textzeile beginnt ein neues Wortpuzzle.",
    modalPlatzhalter: "Mein Name ist Trautmann.\nIch unterrichte Deutsch.\nViel Spaß beim Spielen!",
    modalUebernehmen: "Text übernehmen",
    modalSchliessen:  "Schließen",
    modalLeerFehler:  "Bitte hier die korrekte Wortfolge eingeben!",

    // Maskottchen – Begrüßung beim Start
    maskottStart: "Hallo! Leider habe ich meine Wörter durcheinander gebracht. Bitte hilf mir das Wörterpuzzle zu lösen.",

    // Maskottchen – nach Datei/Text-Eingabe
    begruessung: [
        "Viel Glück beim Puzzeln!",
        "Willkommen in meiner Wörterwelt!",
        "Viel Spaß!"
    ],

    // Maskottchen – Antwort richtig gelöst
    richtig: [
        "Wunderbar!",
        "Perfekt!",
        "Super!",
        "Fantastisch!"
    ],

    // Maskottchen – Teillösung erkannt
    teilRichtig: [
        "Nicht schlecht bis jetzt!",
        "Wir sind auf dem richten Weg!",
        "Das kommt schon richtig gut!"
    ],

    // Maskottchen – falsch
    falsch: [
        "Nur nicht aufgeben!",
        "Leider noch nicht richtig!",
        "Es ist noch kein Meister vom Himmel gefallen."
    ],

    // Spielfeld – Aufgabentext über den Wörtern
    aufgabe: "Bringe die Wörter in die richtige Reihenfolge:",

    // Spielfeld – Fortschrittsanzeige  (  {nr} = aktuelle Nummer,  {gesamt} = Gesamtzahl  )
    fortschritt: "Text {nr} von {gesamt}",

    // Maskottchen – Übergang zum nächsten Satz  (  {nr} = aktuelle Nummer  )
    naechsterSatz: "Weiter geht es mit Text Nummer {nr}:",

    // Prüfen-Button
    btnPruefen: "Prüfen",

    // Ende-Bildschirm
    endeHinweis:  "Perfekt!",
    endeMaskott:  "Du bist jetzt ein Satzbau-Meister!",
    endeBtnNochmal: "Nochmal spielen"
};
// ════════════════════════════════════════════════════════════════

// ── HTML-Texte befüllen ───────────────────────────────────────────
document.getElementById('fileLabel').textContent        = TEXTE.btnDatei;
document.getElementById('textInputBtn').textContent     = TEXTE.btnEingabe;
document.getElementById('musicToggleBtn').textContent   = TEXTE.btnMusikAn;
document.getElementById('checkBtn').textContent         = TEXTE.btnPruefen;
document.getElementById('mascot-text').textContent      = TEXTE.maskottStart;
document.getElementById('modalTitel').textContent       = TEXTE.modalTitel;
document.getElementById('modalHinweis').textContent     = TEXTE.modalHinweis;
document.getElementById('textInputArea').placeholder    = TEXTE.modalPlatzhalter;
document.getElementById('applyTextBtn').textContent     = TEXTE.modalUebernehmen;
document.getElementById('closeTextBtn').textContent     = TEXTE.modalSchliessen;

// ── Daten & Zustand ───────────────────────────────────────────────
let sentences = [TEXTE.beispiel];
let current = 0;
let lastFileData = "";
let errorDamping = 0;

// Generative Audio-Variablen (Portal-Style Varianz)
let proceduralSeed = 1; 
let currentPattern = [1, 1.2, 1.5, 1.8];

// Zeitbasierte Soundkulissen
let playStartTime = null;
let melodyIndex = 0;
const MELODY_NOTES = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.50];
const MELODY_PATTERN = [0, 2, 4, 2, 5, 4, 2, 0, 3, 2, 0, 7, 5, 4, 2, 4]; 


function getRandomElement(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function triggerMascotAnimation(type) {
    const img = document.getElementById('mascot-image');
    img.classList.remove('animate-jump', 'animate-shake');
    void img.offsetWidth;
    if (type === 'jump') { img.classList.add('animate-jump'); } 
    else if (type === 'shake') { img.classList.add('animate-shake'); }
}

// Erzeugt ein neues musikalisches Muster basierend auf Interaktionen
function shiftProceduralMusic() {
    proceduralSeed = Math.random();
    // Dynamischer Wechsel zwischen harmonischen Aperture Science Pentatoniken
    const scalePools = [
        [1, 1.2, 1.33, 1.5, 1.6, 1.8, 2],
        [1, 1.25, 1.44, 1.5, 1.75, 1.875, 2],
        [1, 1.125, 1.35, 1.5, 1.6, 1.9, 2]
    ];
    currentPattern = scalePools[Math.floor(proceduralSeed * scalePools.length)];
}

// ── Neue Prozedurale Portal 2 Audio-Engine ────────────────────────
let audioCtx = null;
let ambientStarted = false;
let ambientInterval = null;
let musicEnabled = true;
let beatIndex = 0;

function initAudio() {
    try {
        if (!audioCtx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return; // Browser unterstützt Web Audio nicht
            audioCtx = new AudioCtx();
        }
        // iOS/Android: AudioContext muss nach User-Interaktion resumed werden
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        if (!ambientStarted) { ambientStarted = true; startAmbientMusic(); }
    } catch(e) {
        // Audio nicht verfügbar – Spiel läuft trotzdem
        audioCtx = null;
    }
}

function tone(freq, type='sine', start=0, dur=0.18, vol=0.15, endFreq=null, filterFreq=2200) {
    if (!audioCtx || audioCtx.state === 'suspended') return;
    try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    filter.type = 'lowpass';
    filter.frequency.value = filterFreq;
    osc.type = type;

    const now = audioCtx.currentTime + start;
    osc.frequency.setValueAtTime(freq, now);
    if (endFreq) { osc.frequency.exponentialRampToValueAtTime(endFreq, now + dur); }

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + dur);
    } catch(e) { /* Audio-Fehler ignorieren */ }
}

function getPuzzleProgress() {
    const pool = document.querySelector('.pool');
    if (!pool) return 0;
    const totalWords = pool.querySelectorAll('.word').length;
    if (totalWords <= 1) return 1;
    const groupedWords = pool.querySelectorAll('.group .word').length;
    return groupedWords / totalWords;
}

function startAmbientMusic() {
    if (!musicEnabled) return;
    if (!playStartTime) playStartTime = Date.now();

    function playBeatStep() {
        if (!musicEnabled) { ambientInterval = null; return; }
        
        const progress = getPuzzleProgress(); 
        const baseNote = 110;
        const elapsed = (Date.now() - playStartTime) / 1000; // Sekunden seit Spielstart
        
        if (errorDamping > 0) errorDamping -= 0.1;

        // LAYER 1: Generative Drone (immer aktiv)
        if (beatIndex % 4 === 0) {
            const droneVol = (0.28 - errorDamping * 0.15);
            const dynamicDroneModifier = 1 + (proceduralSeed * 0.02);
            tone(baseNote * dynamicDroneModifier, 'sine', 0, 1.4, Math.max(0.05, droneVol), baseNote * 1.002, 800);
            tone(baseNote * 1.5, 'sine', 0.2, 1.2, Math.max(0.02, droneVol * 0.4), baseNote * 1.502, 900);
        }

        // LAYER 2: Interaktives Arpeggio
        if (progress > 0.1) {
            const noteStep = (beatIndex + Math.floor(proceduralSeed * 10)) % currentPattern.length;
            const arpFreq = baseNote * 2 * currentPattern[noteStep];
            const arpVol = (0.09 + progress * 0.09) * (1 - errorDamping * 0.5);
            const waveform = proceduralSeed > 0.5 ? 'triangle' : 'sine';
            tone(arpFreq, waveform, 0, 0.22, arpVol, arpFreq * 1.005, 2000);
            if (progress > 0.4 && beatIndex % 2 === 0) {
                tone(arpFreq * 1.33, 'sine', 0.06, 0.12, 0.04, null, 2500);
            }
        }

        // LAYER 3: Mechanischer Takt
        if (progress > 0.6) {
            const clickVol = 0.05 + (progress * 0.04);
            if (beatIndex % 2 === 0) {
                tone(1200 + (proceduralSeed * 400), 'triangle', 0, 0.04, clickVol, 400, 3500); 
            } else {
                tone(180, 'sine', 0, 0.08, clickVol * 1.4, 70, 600); 
            }
        }

        // LAYER 4: Sanfte Melodie – setzt nach 2 Minuten ein (fade-in)
        if (elapsed > 120) {
            const fadeIn = Math.min(1, (elapsed - 120) / 30); // 30 Sek. Einblenden
            if (beatIndex % 3 === 0) {
                const note = MELODY_NOTES[MELODY_PATTERN[melodyIndex % MELODY_PATTERN.length]];
                melodyIndex++;
                const melVol = 0.07 * fadeIn * (1 - errorDamping * 0.4);
                tone(note, 'sine', 0, 0.35, melVol, note * 1.002, 3000);
                // Sanfte Harmonie dazu
                if (beatIndex % 6 === 0) {
                    tone(note * 1.5, 'sine', 0.1, 0.25, melVol * 0.4, note * 1.502, 2500);
                }
            }
        }

        // LAYER 5: Naturgeräusche (Wind & Vogelzwitschern) – nach 5 Minuten
        if (elapsed > 300) {
            const fadeIn = Math.min(1, (elapsed - 300) / 60);
            // Wind: Rauschen durch schnell modulierten Sinus
            if (beatIndex % 8 === 0) {
                const windFreq = 80 + Math.random() * 40;
                tone(windFreq, 'sine', 0, 1.8, 0.04 * fadeIn, windFreq * (0.95 + Math.random() * 0.1), 400);
                tone(windFreq * 1.2, 'sine', 0.3, 1.4, 0.02 * fadeIn, windFreq * 1.1, 350);
            }
            // Vogelzwitschern: kurze hohe Töne mit Frequenzglide
            if (beatIndex % 13 === 0 && Math.random() > 0.4) {
                const birdBase = 1800 + Math.random() * 800;
                tone(birdBase, 'sine', 0,    0.06, 0.06 * fadeIn, birdBase * 1.3, 4000);
                tone(birdBase * 1.3, 'sine', 0.07, 0.05, 0.05 * fadeIn, birdBase * 0.9, 4000);
                tone(birdBase * 0.9, 'sine', 0.13, 0.06, 0.04 * fadeIn, birdBase * 1.1, 4000);
            }
        }

        // LAYER 6: Vollerer Orchestersound – nach 10 Minuten
        if (elapsed > 600) {
            const fadeIn = Math.min(1, (elapsed - 600) / 60);
            // Streicher-ähnlicher Pad (Sawtooth mit starkem Tiefpassfilter)
            if (beatIndex % 4 === 0) {
                const padNotes = [baseNote * 2, baseNote * 2.5, baseNote * 3];
                padNotes.forEach((freq, i) => {
                    tone(freq, 'sawtooth', i * 0.05, 1.6, 0.04 * fadeIn, freq * 1.001, 500);
                });
            }
            // Perkussion: sanfte Trommel
            if (beatIndex % 8 === 0) {
                tone(60, 'sine', 0, 0.12, 0.1 * fadeIn, 30, 300);
            }
            if (beatIndex % 8 === 4) {
                tone(200, 'triangle', 0, 0.05, 0.06 * fadeIn, 150, 800);
            }
        }

        beatIndex++;
        ambientInterval = setTimeout(playBeatStep, 460);
    }
    playBeatStep();
}

// Bei jeder Interaktion wird die Kulisse neu durchgemischt
function playPop() {
    shiftProceduralMusic();
    const popFreq = 540 + (Math.random() * 120);
    tone(popFreq, 'sine', 0, 0.08, 0.22, popFreq + 100, 2500); 
    tone(popFreq * 2, 'triangle', 0.02, 0.04, 0.09, popFreq * 2, 3000); 
}

function playClick() { 
    shiftProceduralMusic();
    tone(280 + (Math.random() * 60), 'triangle', 0, 0.05, 0.25, 340, 1500); 
}

function playPartial() {
    shiftProceduralMusic();
    const harmonyNotes = [440, 554, 659].map(n => n * (1 + (Math.random() * 0.02)));
    harmonyNotes.forEach((freq, i) => { 
        tone(freq, 'triangle', i * 0.08, 0.2, 0.18, freq * 1.02, 2200); 
    });
}

function playWrong() {
    shiftProceduralMusic();
    errorDamping = 1.0; 
    tone(190, 'sawtooth', 0, 0.35, 0.35, 80, 800);
    tone(130, 'triangle', 0.08, 0.3, 0.25, 50, 600);
}

function playStarSound() {
    const starNotes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
    starNotes.forEach((freq, i) => {
        tone(freq, 'sine', i * 0.05, 0.2, 0.16, freq * 1.01, 3500);
    });
}

// ── Datei-Einlesen ────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    // Zuerst als ArrayBuffer einlesen, um die Kodierung zu erkennen
    const bufReader = new FileReader();
    bufReader.onload = (ev) => {
        const buffer = ev.target.result;
        const bytes = new Uint8Array(buffer);

        // BOM-Erkennung: UTF-8 BOM = EF BB BF
        const hasUtf8Bom = bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF;

        // Heuristik: Prüfe ob der Text gültige UTF-8 Sequenzen enthält
        function isValidUtf8(bytes) {
            let i = hasUtf8Bom ? 3 : 0;
            while (i < bytes.length) {
                const b = bytes[i];
                let extra = 0;
                if (b <= 0x7F) { i++; continue; }
                else if (b >= 0xC2 && b <= 0xDF) extra = 1;
                else if (b >= 0xE0 && b <= 0xEF) extra = 2;
                else if (b >= 0xF0 && b <= 0xF4) extra = 3;
                else return false; // ungültiges UTF-8 Startbyte
                for (let j = 1; j <= extra; j++) {
                    if (i + j >= bytes.length || (bytes[i + j] & 0xC0) !== 0x80) return false;
                }
                i += extra + 1;
            }
            return true;
        }

        let encoding = 'UTF-8';
        if (!hasUtf8Bom && !isValidUtf8(bytes)) {
            // Wahrscheinlich Windows-1252 (häufig bei deutschen Windows-Textdateien)
            encoding = 'windows-1252';
        }

        const textReader = new FileReader();
        textReader.onload = (ev2) => {
            // UTF-8 BOM ggf. entfernen
            let text = ev2.target.result;
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            lastFileData = text;
            processData(lastFileData);
        };
        textReader.readAsText(file, encoding);
    };
    bufReader.readAsArrayBuffer(file);
});

// ── Spiel-Logik ───────────────────────────────────────────────────
function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }
window.onload = () => { lastFileData = sentences[0]; showSentence(); };

function updateMascot(text) { document.getElementById('mascot-text').textContent = text; }

function setMascotMood(isSad) {
    const img = document.getElementById('mascot-image');
    if (isSad) { img.classList.add('is-sad'); } else { img.classList.remove('is-sad'); }
}

function showSentence() {
    const game     = document.getElementById('game');
    const checkBtn = document.getElementById('checkBtn');
    game.innerHTML = '';
    document.getElementById('mascot-container').classList.remove('has-heart');

    if (current >= sentences.length) {
        setMascotMood(false);
        triggerMascotAnimation('jump');
        updateMascot(TEXTE.endeMaskott);
        game.innerHTML = '<h3>' + TEXTE.endeHinweis + '</h3>';
        const btn = document.createElement('button');
        btn.className = 'restart-btn';
        btn.innerHTML = TEXTE.endeBtnNochmal;
        btn.onclick = () => { current = 0; processData(lastFileData); };
        game.appendChild(btn);
        checkBtn.style.display = 'none';
        return;
    }

    checkBtn.style.display = 'block';
    const correct = sentences[current];
    const words   = shuffle(correct.split(/\s+/));

    if (current > 0) {
        setMascotMood(false);
        updateMascot(TEXTE.naechsterSatz.replace('{nr}', current + 1));
    }

    const pool = createZone('pool');
    pool.dataset.correct = correct;
    words.forEach(word => pool.appendChild(createWord(word)));
    game.appendChild(pool);
}

function createWord(text) {
    const el = document.createElement('div');
    el.className = 'word';
    el.textContent = text;
    addDragEvents(el);
    return el;
}

function createZone(type) {
    const zone = document.createElement('div');
    zone.className = 'container ' + type;

    zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('drag-over');
        if (!mouseSource) return;
        const toMove = getMovable(mouseSource);
        const after  = getDragAfterElement(zone, e.clientX, e.clientY);
        flipInsert(zone, toMove, after);
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        playPop();
        mouseSource = null;
    });
    return zone;
}

let mouseSource = null;

function addDragEvents(el) {
    el.draggable = true;
    el.addEventListener('dragstart', (e) => {
        mouseSource = el;
        initAudio();
        setTimeout(() => getMovable(el).classList.add('dragging-source'), 0);
    });
    el.addEventListener('dragend', () => {
        if (mouseSource) getMovable(mouseSource).classList.remove('dragging-source');
        mouseSource = null;
    });
    addTouchDrag(el);
}

function addTouchDrag(el) {
    let ghost = null;
    let touchSource = null;
    let offsetX = 0, offsetY = 0;

    el.addEventListener('touchstart', (e) => {
        initAudio();
        touchSource = el;
        const movable = getMovable(el);
        const touch   = e.touches[0];
        const rect    = movable.getBoundingClientRect();

        // clientX/Y ist relativ zum Viewport – kein scrollY nötig für fixed-positioning
        offsetX = touch.clientX - rect.left;
        offsetY = touch.clientY - rect.top;

        ghost = movable.cloneNode(true);
        ghost.classList.add('touch-ghost');
        ghost.style.width  = rect.width  + 'px';
        ghost.style.height = rect.height + 'px';
        ghost.style.left   = (touch.clientX - offsetX) + 'px';
        ghost.style.top    = (touch.clientY - offsetY) + 'px';
        // Pointer-Events deaktivieren damit elementFromPoint funktioniert
        ghost.style.pointerEvents = 'none';
        document.body.appendChild(ghost);

        movable.classList.add('dragging-source');
    }, { passive: true });

    el.addEventListener('touchmove', (e) => {
        if (!touchSource || !ghost) return;
        e.preventDefault();
        const touch = e.touches[0];

        ghost.style.left = (touch.clientX - offsetX) + 'px';
        ghost.style.top  = (touch.clientY - offsetY) + 'px';

        // Ghost kurz verstecken damit elementFromPoint darunter trifft
        ghost.style.visibility = 'hidden';
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        ghost.style.visibility = 'visible';

        const zone = target && target.closest('.container');
        if (!zone) return;

        document.querySelectorAll('.container').forEach(z => z.classList.remove('drag-over'));
        zone.classList.add('drag-over');

        const movable = getMovable(touchSource);
        const after   = getDragAfterElement(zone, touch.clientX, touch.clientY);
        flipInsert(zone, movable, after);
    }, { passive: false });

    const endTouch = () => {
        if (ghost) { ghost.remove(); ghost = null; }
        if (touchSource) {
            getMovable(touchSource).classList.remove('dragging-source');
            touchSource = null;
        }
        document.querySelectorAll('.container').forEach(z => z.classList.remove('drag-over'));
        playPop();
    };
    el.addEventListener('touchend',    endTouch);
    el.addEventListener('touchcancel', endTouch);
}

function getMovable(el) {
    const p = el.parentElement;
    return (p && p.classList.contains('group')) ? p : el;
}

function flipInsert(container, toMove, after) {
    const children = [...container.querySelectorAll('.word:not(.group .word), .group')].filter(el => el !== toMove);
    const first = new Map();
    children.forEach(el => {
        const r = el.getBoundingClientRect();
        first.set(el, { x: r.left, y: r.top });
    });

    if (after == null) container.appendChild(toMove);
    else container.insertBefore(toMove, after);

    children.forEach(el => {
        const f = first.get(el);
        if (!f) return;
        const l = el.getBoundingClientRect();
        const dx = f.x - l.left;
        const dy = f.y - l.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
        el.style.transition = 'none';
        el.style.transform  = `translate(${dx}px, ${dy}px)`;
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                el.style.transition = '';
                el.style.transform  = '';
            });
        });
    });
}

function getDragAfterElement(container, x, y) {
    const items = [...container.querySelectorAll('.word:not(.group .word), .group:not(.dragging-source)')];
    if (items.length === 0) return null;

    const rows = [];
    items.forEach(el => {
        const box = el.getBoundingClientRect();
        const mid = box.top + box.height / 2;
        let row = rows.find(r => Math.abs(r.mid - mid) < box.height * 0.6);
        if (!row) { row = { mid, els: [] }; rows.push(row); }
        row.els.push(el);
    });
    rows.sort((a, b) => a.mid - b.mid);

    let bestRow = rows[0];
    let bestDist = Infinity;
    rows.forEach(r => {
        const d = Math.abs(r.mid - y);
        if (d < bestDist) { bestDist = d; bestRow = r; }
    });

    const sorted = bestRow.els.slice().sort((a, b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left);
    for (const el of sorted) {
        const box = el.getBoundingClientRect();
        if (x < box.left + box.width / 2) return el;
    }
    const rowIdx = rows.indexOf(bestRow);
    if (rowIdx < rows.length - 1) {
        const nextSorted = rows[rowIdx + 1].els.slice().sort((a, b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left);
        return nextSorted[0];
    }
    return null;
}

function normalize(text) { return text.replace(/[.,!?;:]/g, '').replace(/\s+/g, ' ').trim(); }

function checkSentence() {
    const pool    = document.querySelector('.pool');
    if (!pool) return;

    const wordsInOrder = [...pool.querySelectorAll('.word')].map(w => w.textContent);
    const correctStr   = pool.dataset.correct;

    if (normalize(wordsInOrder.join(' ')) === normalize(correctStr)) {
        setMascotMood(false);
        triggerMascotAnimation('jump');
        updateMascot(getRandomElement(TEXTE.richtig));
        document.getElementById('mascot-container').classList.add('has-heart');
        playStarSound();
        setTimeout(() => { current++; showSentence(); }, 2400);
    } else {
        let anyMatch = false;
        while (updateGroupsOnce(pool, correctStr)) { anyMatch = true; }
        
        if (anyMatch) {
            setMascotMood(false);
            triggerMascotAnimation('jump');
            updateMascot(getRandomElement(TEXTE.teilRichtig));
            playPartial(); 
        } else {
            setMascotMood(true);
            triggerMascotAnimation('shake');
            updateMascot(getRandomElement(TEXTE.falsch));
            playWrong(); 
        }
    }
}

function getElementWords(el) {
    if (el.classList.contains('word')) { return [el.textContent]; }
    else { return [...el.querySelectorAll('.word')].map(w => w.textContent); }
}

function updateGroupsOnce(answer, correctStr) {
    const correctWords = correctStr.split(/\s+/);
    const topLevelElements = [...answer.querySelectorAll('.word:not(.group .word), .group')];

    function findMatchingStart(words, usedRanges = []) {
        for (let start = 0; start <= correctWords.length - words.length; start++) {
            let matches = true;
            for (let j = 0; j < words.length; j++) {
                if (normalize(words[j]) !== normalize(correctWords[start + j])) { matches = false; break; }
            }
            if (!matches) continue;
            let overlaps = false;
            for (const r of usedRanges) {
                const end = start + words.length - 1;
                if (!(end < r.start || start > r.end)) { overlaps = true; break; }
            }
            if (!overlaps) return start;
        }
        return -1;
    }

    const usedRanges = [];
    topLevelElements.forEach(el => {
        if (el.classList.contains('group')) {
            const start = parseInt(el.dataset.start);
            const end = parseInt(el.dataset.end);
            if (!isNaN(start) && !isNaN(end)) { usedRanges.push({ start, end }); }
        }
    });

    for (let i = 0; i < topLevelElements.length - 1; i++) {
        const leftEl = topLevelElements[i];
        const rightEl = topLevelElements[i + 1];
        const leftWords = getElementWords(leftEl);
        const rightWords = getElementWords(rightEl);
        const combinedWords = [...leftWords, ...rightWords];

        let valid = false;
        let startIndex = -1;

        if (leftEl.classList.contains('group') && rightEl.classList.contains('group')) {
            const leftEnd = parseInt(leftEl.dataset.end);
            const rightStart = parseInt(rightEl.dataset.start);
            if (leftEnd + 1 === rightStart) { valid = true; startIndex = parseInt(leftEl.dataset.start); }
        } else if (leftEl.classList.contains('group')) {
            const leftEnd = parseInt(leftEl.dataset.end);
            const tempRanges = usedRanges.filter(r => !(r.start === parseInt(leftEl.dataset.start) && r.end === parseInt(leftEl.dataset.end)));
            const pos = findMatchingStart(rightWords, tempRanges);
            if (pos === leftEnd + 1) { valid = true; startIndex = parseInt(leftEl.dataset.start); }
        } else if (rightEl.classList.contains('group')) {
            const rightStart = parseInt(rightEl.dataset.start);
            const tempRanges = usedRanges.filter(r => !(r.start === parseInt(rightStart) && r.end === parseInt(rightEl.dataset.end)));
            const pos = findMatchingStart(leftWords, tempRanges);
            if (pos + leftWords.length === rightStart) { valid = true; startIndex = pos; }
        } else {
            startIndex = findMatchingStart(combinedWords, usedRanges);
            if (startIndex !== -1) { valid = true; }
        }

        if (!valid) continue;
        let group;

        if (leftEl.classList.contains('group')) {
            group = leftEl;
            if (rightEl.classList.contains('group')) {
                [...rightEl.querySelectorAll('.word')].forEach(w => group.appendChild(w));
                group.dataset.end = rightEl.dataset.end;
                rightEl.remove();
            } else {
                group.appendChild(rightEl);
                group.dataset.end = parseInt(group.dataset.end) + rightWords.length;
            }
        } else if (rightEl.classList.contains('group')) {
            group = rightEl;
            group.insertBefore(leftEl, group.firstChild);
            group.dataset.start = startIndex;
        } else {
            group = document.createElement('div');
            group.className = 'group';
            group.dataset.start = startIndex;
            group.dataset.end = startIndex + combinedWords.length - 1;
            addTouchDrag(group);
            group.draggable = true;

            group.addEventListener('dragstart', (e) => {
                mouseSource = group.querySelector('.word');
                initAudio();
                setTimeout(() => group.classList.add('dragging-source'), 0);
            });
            group.addEventListener('dragend', () => { group.classList.remove('dragging-source'); mouseSource = null; });

            answer.insertBefore(group, leftEl);
            group.appendChild(leftEl);
            group.appendChild(rightEl);
        }

        [...answer.querySelectorAll('.group')].forEach(g => { if (g.children.length === 0) g.remove(); });
        return true;
    }
    return false;
}
</script>
</body>
</html>
